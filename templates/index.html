<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>JWT Analyzer</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">
    <h1 class="text-center mb-4">🔐 JWT Analyzer – Web Version</h1>

    <form method="POST">

        <!-- JWT Input -->
        <div class="mb-3">
            <label class="form-label fw-bold">JWT Token</label>
            <textarea name="jwt" class="form-control" rows="3">{{ token }}</textarea>
        </div>

        <!-- Secret -->
        <div class="mb-3">
            <label class="form-label fw-bold">Secret (opcional)</label>
            <input name="secret" class="form-control" value="{{ secret }}">
        </div>

        <!-- Actions -->
        <button name="action" value="decode" class="btn btn-primary me-2">Decodificar</button>
        <button name="action" value="validate" class="btn btn-warning me-2">Validar</button>
        <button name="action" value="verify" class="btn btn-success me-2">Verificar Firma</button>

        <hr>

        <h3>🆕 Crear un nuevo JWT</h3>

        <div class="mb-3">
            <label class="form-label fw-bold">Payload JSON</label>
            <textarea name="payload_new" class="form-control" rows="3">{{ payload_new }}</textarea>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Secret</label>
            <input name="secret_new" class="form-control">
        </div>

        <button name="action" value="create" class="btn btn-info">Crear JWT</button>

    </form>

    <hr>

    <h3 class="mt-4">Resultado:</h3>
    <pre class="output-box">{{ output }}</pre>

    {% if new_token %}
    <h3>Nuevo Token:</h3>
    <pre class="output-box">{{ new_token }}</pre>
    {% endif %}
</div>

</body>
</html>
